settings:
  # kolik poslednich stranek vlakna kontrolovat (2 = posledni + predposledni,
  # bezpecna rezerva kdyby pres noc pribylo vic nez jedna stranka prispevku)
  pages_back: 2
  # pauza mezi requesty v sekundach (bud slusny k serveru)
  delay_seconds: 4
  # kolik polozek drzet ve vysledenem feedu
  max_feed_items: 300
  # vystupni soubory
  feed_file: "feed.xml"
  state_file: "state.json"
  items_file: "items.json"

feed:
  title: "Fora - sledovana vlakna"
  description: "Nove prispevky z vybranych vlaken MobilMania a FinExpert"
  language: "cs"
