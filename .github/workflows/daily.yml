name: Denní scrape fóra

on:
  schedule:
    # 04:30 UTC = 6:30 CEST (v zimě 5:30) – GitHub cron jede v UTC
    - cron: "30 4 * * *"
  workflow_dispatch: {}   # možnost spustit ručně z GitHubu

permissions:
  contents: write

concurrency:
  group: forum-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scraper.py

      - name: Commit & push feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml state.json items.json
          if git diff --staged --quiet; then
            echo "Žádné změny, nic nekomituju."
          else
            git commit -m "feed: update $(date -u +%F)"
            git push
          fi
